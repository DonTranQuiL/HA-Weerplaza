version: 2
# Keep workflow files in LF line endings (see .gitattributes): Dependabot cannot
# rewrite action pins in CRLF files and fails with "No files changed!".

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
